<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillTree PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday-work: herramienta diaria, tranquila, con guiño de videojuego retro
   IDEA un gestor de proyectos que se juega como un RPG de los 90 en una terminal de tonos suaves
   PICTURE tablero de misiones en uso; árbol de habilidades explicado; avatares ASCII dibujables
   COLOUR piedra cálida / carbón cálido; taupe, arena, salvia, azul polvo; rosa apagado para alertas
   TYPE Pixelify Sans (marca, títulos) + IBM Plex Sans (texto) + Plex Mono (contadores, ASCII)
   LAYOUT menú lateral plegable + cabecera; en móvil cabecera + barra inferior y botón flotante */
:root{color-scheme:light;--bg:#ebe5da;--bg2:#e1d9ca;--surf:#f8f4ed;--surf2:#f0eadf;--ink:#2e2a26;--mute:#5e574e;--line:#cbc0ae;--sh:#cfc4b2;--taupe-d:#76634a;--sage-d:#4b6658;--blue-d:#4b5b7a;--rose-d:#8d4d44;--side:#e1d9ca;
--taupe:#b9a487;--sand:#dccca7;--sage:#97ad9f;--blue:#97a6c0;--rose:#d1a39a;--dark:#2e2a26;--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=dark]{color-scheme:dark;--bg:#25221f;--bg2:#2d2a26;--surf:#35312d;--surf2:#3e3934;--ink:#ece5d8;--mute:#b4aa9b;--line:#4f4842;--sh:#141210;--taupe-d:#d2bea0;--sage-d:#adc4b6;--blue-d:#b3c0d8;--rose-d:#e6b7ae;--side:#2a2724}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#25221f;--bg2:#2d2a26;--surf:#35312d;--surf2:#3e3934;--ink:#ece5d8;--mute:#b4aa9b;--line:#4f4842;--sh:#141210;--taupe-d:#d2bea0;--sage-d:#adc4b6;--blue-d:#b3c0d8;--rose-d:#e6b7ae;--side:#2a2724}}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip;transition:background .35s,color .35s}
h1,h2,h3{font-family:"Pixelify Sans","IBM Plex Mono",monospace;font-weight:600;line-height:1.1;margin:0 0 .4em;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(30px,4.4vw,44px)}h2{font-size:clamp(24px,3vw,30px)}h3{font-size:19px}
p{margin:0 0 .7em}
.mono{font-family:"IBM Plex Mono",monospace}
.mute{color:var(--mute)}.ok{color:var(--sage-d)}.bad{color:var(--rose-d)}.warn{color:var(--taupe-d)}
.small{font-size:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue-d);outline-offset:2px}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;border:2px solid var(--ink);background:var(--surf);border-radius:8px;font-weight:500;box-shadow:3px 3px 0 var(--sh);transition:transform .12s var(--ease),box-shadow .12s,background .2s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--sh)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.warnb{background:var(--rose);color:var(--dark)}
.btn.ghost{box-shadow:none;border-width:1.5px;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);transform:none}
.btn.icon{width:44px;padding:0}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;min-width:40px;padding:6px 12px;border:1.5px solid var(--line);background:var(--surf);border-radius:8px;transition:all .18s}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=number],textarea,select{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surf);transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:3px 3px 0 var(--sh)}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-weight:600;margin:14px 0 6px;font-size:15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;color:var(--ink)}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--taupe),var(--blue));border:1.5px solid currentColor}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--taupe),var(--blue));border:1.5px solid currentColor}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:5px;background:var(--surf);border:3px solid currentColor}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:5px;background:var(--surf);border:3px solid currentColor}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--sage-d);flex:none}
.tag{display:inline-block;font:500 12.5px "IBM Plex Mono",monospace;padding:1px 7px;border-radius:4px;background:var(--c,var(--taupe));color:var(--dark);margin:0 4px 4px 0;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:1px 9px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}
.chipbad{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:5px;background:var(--rose);color:var(--dark)}
.chipw{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:5px;background:var(--sand);color:var(--dark)}
.bar{display:block;height:10px;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--surf)}
.bar i{display:block;height:100%;background:var(--sage);transition:width .6s var(--ease)}
.avt{display:inline-grid;place-items:center;width:var(--s,30px);height:var(--s,30px);border-radius:calc(var(--s,30px)*.26);background:var(--c);color:var(--dark);font:600 calc(var(--s,30px)*.48) "Pixelify Sans",monospace;border:1.5px solid var(--ink);flex:none;overflow:hidden;vertical-align:middle}
.avt.asc{background:#f3ece0;color:#2e2a26}
.avt.asc pre{margin:0;font-family:"IBM Plex Mono",monospace;font-weight:500;line-height:1.12;white-space:pre;color:#2e2a26}
.avt.th img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto}
.avt.ph{background:var(--surf2)}
.avt.ph img{width:100%;height:100%;object-fit:cover;display:block}
.box{background:var(--surf);border:1.5px solid var(--line);border-radius:10px;padding:16px}
.win{background:var(--surf);border:2px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--sh);overflow:hidden}
.win>.wt{padding:9px 14px;border-bottom:2px solid var(--ink);font:500 13.5px "IBM Plex Mono",monospace;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surf2)}
.win>.wb{padding:16px}
kbd{font:500 12px "IBM Plex Mono",monospace;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:5px;padding:1px 6px;background:var(--surf)}
/* shell */
.shell{display:grid;grid-template-columns:var(--sw,248px) minmax(0,1fr);min-height:100%;transition:grid-template-columns .3s var(--ease)}
.shell.col{--sw:76px}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:2px solid var(--ink);display:flex;flex-direction:column;padding:14px 12px;gap:6px;overflow:hidden auto;transition:background .35s}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1.5px dashed var(--line);margin-bottom:4px;white-space:nowrap}
.brand b{font:600 21px "Pixelify Sans",monospace}
.logo-m{width:34px;height:34px;flex:none}
.nav{display:flex;flex-direction:column;gap:3px}
.nv{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:7px 12px;border:2px solid transparent;border-radius:9px;background:transparent;color:var(--mute);font-weight:500;text-align:left;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.nv:hover{background:var(--surf);color:var(--ink)}
.nv[aria-current=page]{background:var(--surf);color:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--sh)}
.nv[aria-current=page]::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:5px;border-radius:0 4px 4px 0;background:var(--taupe-d)}
.nv .cnt{margin-left:auto;font:500 12px "IBM Plex Mono",monospace;background:var(--rose);color:var(--dark);border-radius:99px;padding:0 7px}
.nv .cnt.n{background:var(--line);color:var(--ink)}
.col .nv span.l,.col .nv .cnt,.col .brand b,.col .sideuser .who,.col .navlab{display:none}
.col .nv{justify-content:center;padding:8px}
.navlab{font:500 12px "IBM Plex Mono",monospace;color:var(--mute);padding:12px 12px 3px;white-space:nowrap}
.sideuser{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1.5px dashed var(--line)}
.sideuser .who{flex:1;line-height:1.25;white-space:nowrap;overflow:hidden}
.sideuser .who small{display:block;color:var(--mute);font-size:13px}
.colbtn{border:0;background:transparent;color:var(--mute);width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none}
.colbtn:hover{background:var(--surf);color:var(--ink)}
.col .colbtn svg{transform:rotate(180deg)}
.hdr{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px max(2.4vw,16px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line);transition:background .35s}
.hdr .ttl{flex:1;min-width:0}
.hdr .ttl b{display:block;font:600 22px/1.15 "Pixelify Sans",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl small{color:var(--mute);font-size:13px}
.srch{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surf);color:var(--mute);min-width:220px}
.srch:hover{border-color:var(--ink)}
.srch kbd{margin-left:auto}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:9px;background:var(--surf);transition:border-color .2s}
.ib:hover{border-color:var(--ink)}
.ib .dot{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:99px;background:var(--rose);color:var(--dark);font:600 12px/20px "IBM Plex Mono",monospace;text-align:center;border:2px solid var(--bg);animation:pop .4s var(--ease)}
.thm svg{transition:transform .5s var(--ease)}
.thm:hover svg{transform:rotate(40deg)}
.ubtn{border:0;background:none;padding:0;border-radius:9px}
main{padding:22px max(2.4vw,16px) 60px;max-width:1500px;width:100%;margin:0 auto}
.bnav,.fab{display:none}
@media(max-width:900px){
 .shell{grid-template-columns:minmax(0,1fr)}
 .side{display:none}
 .srch{min-width:0;width:44px;padding:0;justify-content:center}.srch span,.srch kbd{display:none}
 .hdr .newb span{display:none}.hdr .newb{width:44px;padding:0}
 main{padding-bottom:110px}
 .bnav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--side);border-top:2px solid var(--ink);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));transition:background .35s}
 .bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border:0;background:none;color:var(--mute);font-size:12px;border-radius:8px;position:relative}
 .bnav button[aria-current=page]{color:var(--ink);background:var(--surf)}
 .bnav .cnt{position:absolute;top:2px;left:calc(50% + 6px);font:600 11px "IBM Plex Mono",monospace;background:var(--rose);color:var(--dark);border-radius:99px;padding:0 5px}
 .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:84px;z-index:16;width:58px;height:58px;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);box-shadow:4px 4px 0 var(--sh)}
}
@media(max-width:520px){.hdr .ttl small{display:none}.hdr{gap:6px}.thm{display:none}}
.enter>*{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(100%)}}
@keyframes zoom{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.grow i{transform-origin:left;animation:grow .9s var(--ease) both}
/* tablero */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar .q{position:relative;flex:1 1 220px;max-width:340px}
.toolbar .q svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute)}
.toolbar .q input{padding-left:38px}
.sprint{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border:2px solid var(--ink);border-radius:12px;background:linear-gradient(100deg,color-mix(in srgb,var(--blue) 30%,var(--surf)),var(--surf) 70%);margin-bottom:16px;box-shadow:3px 3px 0 var(--sh)}
.sprint b{font:600 18px "Pixelify Sans",monospace}
.sprint .bar{width:180px}
@media(max-width:600px){.sprint{grid-template-columns:minmax(0,1fr)}.sprint .bar{width:100%}}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:1180px){.kb{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.kb{grid-template-columns:minmax(0,1fr)}}
.coln{background:var(--bg2);border:1.5px dashed var(--line);border-radius:12px;padding:10px;min-height:200px;transition:background .2s,border-color .2s}
.coln.over{background:color-mix(in srgb,var(--sage) 22%,var(--bg2));border-color:var(--ink);border-style:solid}
.coln.no{opacity:.55}
.coln.wipx{border-color:var(--rose-d);border-style:solid}
.coln h4{margin:2px 4px 10px;font:500 13px "IBM Plex Mono",monospace;display:flex;align-items:center;gap:8px;color:var(--mute)}
.coln h4 i{width:10px;height:10px;border-radius:3px;background:var(--c);border:1.5px solid var(--ink)}
.coln h4 .wip{margin-left:auto;white-space:nowrap}
.coln.wipx h4 .wip{color:var(--rose-d);font-weight:600}
.card{display:block;width:100%;text-align:left;background:var(--surf);border:1.5px solid var(--ink);border-radius:10px;padding:11px 12px;margin-bottom:10px;box-shadow:3px 3px 0 var(--sh);transition:transform .18s var(--ease),box-shadow .18s;position:relative}
.card:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--sh)}
.card.drag{opacity:.4;transform:rotate(2deg)}
.card.blk{border-color:var(--rose-d);border-width:2px}
.card .t{font-weight:600;line-height:1.3;margin-bottom:7px;padding-right:6px}
.card .m{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:8px}
.card .m span{display:inline-flex;align-items:center;gap:4px}
.card .flags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.dif{font:500 12px "IBM Plex Mono",monospace;letter-spacing:1px;color:var(--taupe-d)}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:22px 6px;border:1.5px dashed var(--line);border-radius:10px}
.addc{width:100%;min-height:40px;border:1.5px dashed var(--line);border-radius:10px;background:none;color:var(--mute);font-size:14px}
.addc:hover{border-color:var(--ink);color:var(--ink)}
/* inicio */
.greet{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1000px){.kpis.k5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:800px){.kpis,.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{text-align:left;border:2px solid var(--ink);border-radius:12px;padding:14px;background:var(--surf);box-shadow:4px 4px 0 var(--sh);position:relative;overflow:hidden;transition:transform .18s var(--ease)}
button.kpi:hover{transform:translateY(-2px)}
.kpi b{display:block;font:600 clamp(28px,3.6vw,38px)/1 "Pixelify Sans",monospace;white-space:nowrap}
.kpi span{font-size:14px;color:var(--mute)}
.kpi::after{content:"";position:absolute;right:-14px;top:-14px;width:56px;height:56px;border-radius:12px;background:var(--c);opacity:.55;transform:rotate(12deg)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media(max-width:900px){.g2{grid-template-columns:minmax(0,1fr)}}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 4px;border:0;background:none;border-radius:8px;transition:background .15s}
button.lrow:hover{background:var(--surf2)}
.lrow .s{display:block;font-size:13px;color:var(--mute)}
.lrow .r{font-size:13px;color:var(--mute);white-space:nowrap}
.aic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--c);color:var(--dark);border:1.5px solid var(--ink)}
.load{display:grid;grid-template-columns:auto minmax(0,1fr) 60px;gap:12px;align-items:center;padding:8px 0;font-size:15px}
.load .bar i{background:var(--c,var(--sage))}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:20px;border:2px solid var(--ink);border-radius:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--sand) 45%,var(--surf)),var(--surf) 60%);box-shadow:5px 5px 0 var(--sh);margin-bottom:18px}
@media(max-width:700px){.hero{grid-template-columns:auto minmax(0,1fr)}.hero .stat{grid-column:1/-1}}
.hero .av{position:relative}
.hero .av button{position:absolute;right:-8px;bottom:-8px;width:36px;height:36px;border-radius:9px;border:2px solid var(--ink);background:var(--surf);display:grid;place-items:center}
.stat{display:grid;grid-template-columns:repeat(3,minmax(78px,1fr));gap:8px;text-align:center}
.stat div{border:1.5px solid var(--ink);border-radius:9px;padding:6px 8px;background:var(--surf)}
.stat b{display:block;font:600 24px "Pixelify Sans",monospace}
.stat span{font-size:12.5px;color:var(--mute)}
.xpbar{height:14px;border:2px solid var(--ink);border-radius:5px;overflow:hidden;background:var(--surf);margin-top:10px}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--sage) 0 10px,color-mix(in srgb,var(--sage) 80%,#fff) 10px 12px);transform-origin:left;animation:grow 1.1s var(--ease) both}
/* capa */
.ov{position:fixed;inset:0;z-index:30;background:rgba(28,25,22,.42);display:flex;justify-content:flex-end}
.ov.in{animation:fade .25s ease-out}
.ov.clear{background:transparent}
.dr{width:min(680px,100%);height:100%;display:flex;flex-direction:column;background:var(--bg);border-left:3px solid var(--ink)}
.ov.in .dr{animation:slide .38s var(--ease)}
.dr .dh{padding:16px 20px 12px;border-bottom:1.5px solid var(--line);background:var(--bg2)}
.dr .db{flex:1;overflow-y:auto;padding:4px 20px 20px;overscroll-behavior:contain}
.dr .df{padding:12px 20px;border-top:2px solid var(--ink);background:var(--bg2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtop .sp{flex:1}

@keyframes light{from{fill:#2f2b27;stroke:#5a524b}}
.lt text{font:500 14px "IBM Plex Mono",monospace;fill:#a99f91;text-anchor:middle}
.lt .on text{fill:#2e2a26}
.lform{display:grid;place-items:center;padding:clamp(24px,5vw,56px) 16px;background:var(--bg);position:relative}
.lform .thl{position:absolute;top:16px;right:16px}
.lcard{width:min(440px,100%)}
.lcard.shake{animation:shake .45s}
.role{position:relative;display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:12px;padding:4px;background:var(--surf);margin:18px 0 6px}
.role button{position:relative;z-index:1;min-height:52px;border:0;background:none;border-radius:8px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:color .25s}
.role button[aria-pressed=true]{color:var(--bg)}
.role .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:8px;background:var(--ink);transition:transform .35s var(--ease)}
.role.w .ind{transform:translateX(100%)}
.pw{position:relative}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--mute);border-radius:8px}
.err{min-height:24px;color:var(--rose-d);font-size:14.5px;margin:10px 0 0}
.demo{margin-top:22px;border:1.5px dashed var(--line);border-radius:12px;padding:12px}
.demo button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:6px 8px;border-radius:8px;text-align:left;min-height:44px}
.demo button:hover{background:var(--surf)}
.demo small{color:var(--mute);font-family:"IBM Plex Mono",monospace}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}
.spin{width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;display:grid;gap:8px;width:min(460px,calc(100% - 32px))}
@media(max-width:900px){.toast{bottom:92px}}
@media(min-width:901px){.toast{left:24px;transform:none;width:min(420px,calc(100% - 48px))}}
.toast>div{display:flex;align-items:center;gap:12px;background:#24211e;color:#ece5d8;border:2px solid #dccca7;border-radius:10px;padding:10px 14px;box-shadow:4px 4px 0 rgba(0,0,0,.3);animation:rise .3s var(--ease)}
.toast>div.out{opacity:0;transform:translateY(10px);transition:all .3s}
.toast .tx{flex:1}
.toast button{border:1.5px solid #8a8076;background:none;color:#ece5d8;border-radius:6px;min-height:36px;padding:2px 10px;font-weight:600}

@media(max-width:600px){.toolbar .seg{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px}.toolbar .seg button{flex:none}.toolbar .q{max-width:none;flex-basis:100%}}

 else if(e.id==='prog'&&t){t.p=+e.value;$('#progv').textContent=t.p+'%';save()}
 else if(e.id==='nt'||e.id==='nd'){st.draft[e.id==='nt'?'t':'d']=e.value;autotag();updNew()}
 else if(e.id==='ndue'){st.draft.due=e.value;st.draft.dueMan=true}
 else if(e.id==='bq'){st.flt.q=e.value;const k=$('#kb');if(k){const tmp=document.createElement('div');tmp.innerHTML=boardV();k.replaceWith(tmp.querySelector('#kb'))}}
 else if(e.id==='cmt'&&t){st.cd[t.id]=e.value;mentionUI('cmt')}
 else if(e.id==='chm'){st.cd[st.conv]=e.value;mentionUI('chm')}
 else if(e.id==='palq'){st.pal.q=e.value;st.pal.i=0;$('#pres').innerHTML=palList()}
 else if(e.id==='avtxt'){const A=e.value.split('\n');if(A.length>MAXH||A.some(l=>l.length>MAXW)){const p=e.selectionStart;e.value=A.slice(0,MAXH).map(l=>l.slice(0,MAXW)).join('\n');e.selectionStart=e.selectionEnd=Math.min(p,e.value.length)}const art=trimArt(e.value.split('\n'));const b=$('#avbig');if(b)b.innerHTML=preFit(art,200)}
 else if(/^cv(cols|bri|con|edge|bg)$/.test(e.id)){const v=st.av.cv;if(e.id==='cvbg')v.bg=+e.value;if(e.id==='cvcols')v.cols=+e.value;if(e.id==='cvbri')v.bri=+e.value;if(e.id==='cvcon')v.con=+e.value;if(e.id==='cvedge'){v.edgeAmt=+e.value;v.edge=v.edgeAmt>0}const lab=e.previousElementSibling&&e.previousElementSibling.querySelector('span');if(lab)lab.textContent=e.id==='cvcols'?v.cols+' columnas':e.id==='cvbri'?(v.bri>0?'+':'')+v.bri:e.id==='cvcon'?f1(v.con):e.id==='cvbg'?(v.bg?v.bg+' %':'no'):(v.edge?v.edgeAmt+' %':'no');runCv();updAvPrev()}
 else if(e.id==='wn'&&!st.nwTouched){const u=$('#wu');u.value=(e.value.split(' ')[0]||'').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'').slice(0,16)}
 else if(e.id==='wu')st.nwTouched=true});
document.addEventListener('change',ev=>{const e=ev.target,t=T(st.open);
 if(e.id==='bsort'){st.flt.sort=e.value;flip(()=>renderView(false))}
 else if(e.id==='dst'&&t){if(!moveTask(t,e.value))e.value=t.st;else{if(e.value==='done'&&st.modal!=='lvl')st.open=null;refresh()}}
 else if(e.id==='avfile'&&e.files[0]){loadImg(e.files[0],gotImg)}
 else if(['cvstyle','cvinv','cvdith'].includes(e.id)){const v=st.av.cv;if(e.id==='cvstyle')v.style=e.value;if(e.id==='cvinv')v.inv=e.checked;if(e.id==='cvdith')v.dith=e.checked;runCv();updAvPrev()}
 else if(e.dataset.cl!==undefined&&t){snap();t.cl[+e.dataset.cl].ok=e.checked;if(t.st==='doing')t.p=clp(t);sysC(t,`${e.checked?'completó':'desmarcó'} el paso «${t.cl[+e.dataset.cl].x}»`);save();refresh();if(t.cl.every(c=>c.ok)&&t.a===U)toast(isA()?'Checklist completo.':'¡Checklist completo! Ya puedes solicitar revisión.')}});
document.addEventListener('dragover',ev=>{const d=ev.target.closest&&ev.target.closest('.drop');if(d){ev.preventDefault();d.classList.add('over')}});
document.addEventListener('drop',ev=>{const d=ev.target.closest&&ev.target.closest('.drop');if(d){ev.preventDefault();d.classList.remove('over');const f=ev.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))loadImg(f,gotImg)}});
document.addEventListener('keydown',ev=>{
 const tg=ev.target,typing=/INPUT|TEXTAREA|SELECT/.test(tg.tagName);
 if(st.modal==='pal'&&['ArrowDown','ArrowUp','Enter'].includes(ev.key)){const R=palItems();if(ev.key==='Enter'){ev.preventDefault();const b=$(`[data-pi="${st.pal.i}"]`);b&&b.click();return}ev.preventDefault();st.pal.i=(st.pal.i+(ev.key==='ArrowDown'?1:-1)+R.length)%Math.max(R.length,1);$('#pres').innerHTML=palList();const s=$('[aria-selected=true]');s&&s.scrollIntoView({block:'nearest'});return}
 if(ev.key==='Escape'){if(st.editC){st.editC=null;renderLayer();return}if(st.modal||st.open){ev.preventDefault();closeLayer()}return}
 if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){if(!U)return;ev.preventDefault();st.modal='pal';st.pal={q:'',i:0};renderLayer();return}
 if(tg.id==='cmt'&&(ev.ctrlKey||ev.metaKey)&&ev.key==='Enter'){ev.preventDefault();sendComment();return}
 if(tg.id==='chm'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();sendChat();return}
 if(tg.id==='clnew'&&ev.key==='Enter'){ev.preventDefault();$('[data-act=cladd]').click();return}
 if(tg.id==='ec'&&(ev.ctrlKey||ev.metaKey)&&ev.key==='Enter'){ev.preventDefault();$('[data-act=csave]').click();return}
 const nd=tg.closest&&tg.closest('.node');if(nd&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();nd.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}
 if(typing||!U||ev.ctrlKey||ev.metaKey||ev.altKey)return;
 if(st.modal&&st.modal!=='notif'&&st.modal!=='user')return;
 const k=ev.key;
 if(k==='/'){ev.preventDefault();st.modal='pal';st.pal={q:'',i:0};renderLayer()}
 else if(k==='n'||k==='N'){if(isA()){ev.preventDefault();st.modal='new';st.open=null;renderLayer()}}
 else if(k==='t'||k==='T')toggleTheme();
 else if(k==='m'||k==='M')go('chat');
 else if(k==='?'){st.modal='keys';renderLayer()}
 else if(/^[1-7]$/.test(k)&&!st.open){const v=views()[+k-1];v&&go(v[0])}});
document.addEventListener('click',ev=>{const g=ev.target.closest('.node');if(!g)return;st.selN=g.dataset.n;drawTree();const s=$('#nside');if(s)s.innerHTML=nodeSide()});
let dragId=null;
document.addEventListener('dragstart',ev=>{const c=ev.target.closest&&ev.target.closest('.card');if(!c||!isA())return;dragId=+c.dataset.id;ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',c.dataset.id);setTimeout(()=>c.classList.add('drag'),0);const t=T(dragId);$$('.coln').forEach(col=>{if(col.dataset.col==='done'&&t.st!=='review')col.classList.add('no')})});
document.addEventListener('dragend',()=>{dragId=null;$$('.card.drag').forEach(c=>c.classList.remove('drag'));$$('.coln').forEach(c=>c.classList.remove('over','no'))});
document.addEventListener('dragover',ev=>{const c=ev.target.closest&&ev.target.closest('.coln');if(!c||dragId==null||c.classList.contains('no'))return;ev.preventDefault();$$('.coln.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')});
document.addEventListener('drop',ev=>{const c=ev.target.closest&&ev.target.closest('.coln');if(!c||dragId==null)return;ev.preventDefault();const t=T(dragId),to=c.dataset.col;c.classList.remove('over');if(t&&t.st!==to&&moveTask(t,to)){renderSide();renderHdr();flip(()=>renderView(false));renderLayer()}});
setInterval(()=>{if(U&&!st.modal&&!st.open&&['home','act','board','met'].includes(st.view)&&document.visibilityState==='visible'&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||''))renderView(false)},60000);
if(U){st.selP=isA()?'equipo':U;shell()}else loginV();
}
</script>
</body>
</html>
